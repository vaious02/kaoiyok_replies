[build]
  publish = "."

# config.js ห้าม cache ยาว ไม่งั้นแก้ค่า Supabase แล้วเบราว์เซอร์ยังใช้ของเก่า
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
