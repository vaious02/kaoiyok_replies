<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE4">
<title>คลังคำตอบแชท · เก้าอี้โยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFE4;
    --card:#FFFDF8;
    --ink:#3A322A;
    --muted:#7C7166;
    --sage:#5F7D5C;
    --sage-deep:#3F5240;
    --sage-soft:#E6EDE0;
    --clay:#A8703F;
    --line:rgba(58,50,42,.12);
    --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans Thai Looped",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + var(--safe-b));
  }
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:var(--sage-deep)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(242,239,228,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
  .mark{width:34px;height:34px;flex:none}
  .brand{flex:1;min-width:0}
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .brand p{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  .authbtn{
    display:flex;align-items:center;gap:6px;
    min-height:38px;padding:0 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;white-space:nowrap;
  }
  .authbtn.on{border-color:var(--sage);color:var(--sage-deep);background:var(--sage-soft)}
  .avatar{width:22px;height:22px;border-radius:50%;object-fit:cover}

  .searchwrap{padding:0 16px 10px;position:relative}
  .searchwrap svg{position:absolute;left:28px;top:50%;transform:translateY(-58%);opacity:.45}
  input[type=search]{
    width:100%;min-height:44px;padding:0 40px 0 40px;
    border-radius:999px;border:1px solid var(--line);
    background:var(--card);outline:none;-webkit-appearance:none;
  }
  input[type=search]:focus-visible{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
  .clearbtn{position:absolute;right:24px;top:4px;width:36px;height:36px;font-size:18px;color:var(--muted);display:none}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 11px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;min-height:34px;padding:0 14px;border-radius:999px;
    border:1px solid var(--line);background:transparent;
    font-size:13.5px;color:var(--muted);white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff;font-weight:500}

  /* ---------- feed ---------- */
  main{padding:14px 16px 0;max-width:640px;margin:0 auto}
  .count{font-size:12px;color:var(--muted);margin:0 2px 12px;letter-spacing:.04em}

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 15px 11px;margin-bottom:14px;
  }
  .eyebrow{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:11px;letter-spacing:.1em;color:var(--sage);
    text-transform:uppercase;margin-bottom:5px;font-weight:600;
  }
  .card h2{margin:0 0 3px;font-size:16.5px;font-weight:700;line-height:1.4}
  .situation{margin:0 0 13px;font-size:13.5px;color:var(--muted)}
  .situation::before{content:"ลูกค้าทัก · ";color:var(--sage)}

  /* signature: ข้อความจริงเป็นบับเบิล กดที่บับเบิลเพื่อคัดลอก */
  .bubble{
    display:block;width:100%;text-align:right;position:relative;
    background:var(--sage-soft);color:var(--ink);
    border-radius:18px 18px 18px 5px;
    padding:11px 42px 11px 14px;margin-bottom:7px;
    text-align:left;line-height:1.6;
    transition:background .18s ease,transform .12s ease;
  }
  .bubble:last-of-type{border-radius:18px 18px 18px 18px}
  .bubble:active{transform:scale(.985)}
  .bubble.done{background:#D8E6D2}
  .bubble .ico{
    position:absolute;right:11px;top:11px;width:19px;height:19px;
    opacity:.4;transition:opacity .18s ease;
  }
  .bubble.done .ico{opacity:1;color:var(--sage-deep)}
  .bubble mark{background:#F6E4CE;color:#7A4E1E;padding:1px 4px;border-radius:5px;font-weight:500}

  .cardfoot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .copyall{
    min-height:36px;padding:0 13px;border-radius:999px;
    border:1px solid var(--sage);color:var(--sage-deep);
    font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  }
  .copyall.done{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
  .warn{font-size:12px;color:var(--clay);display:flex;align-items:center;gap:4px}
  .note{margin:9px 0 0;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
  .adminrow{margin-left:auto;display:flex;gap:4px}
  .iconbtn{width:36px;height:36px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
  .iconbtn:hover{background:var(--sage-soft);color:var(--sage-deep)}

  .empty{text-align:center;padding:56px 20px;color:var(--muted)}
  .empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
  .skeleton{height:132px;border-radius:var(--radius);background:linear-gradient(100deg,#FFFDF8 30%,#F6F2E7 50%,#FFFDF8 70%);background-size:220% 100%;animation:sk 1.3s infinite;margin-bottom:14px;border:1px solid var(--line)}
  @keyframes sk{to{background-position:-120% 0}}

  /* ---------- fab + sheet ---------- */
  .fab{
    position:fixed;right:16px;bottom:calc(18px + var(--safe-b));z-index:45;
    min-height:52px;padding:0 20px;border-radius:999px;
    background:var(--sage-deep);color:#fff;font-weight:600;font-size:15px;
    display:none;align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(63,82,64,.3);
  }
  .fab.show{display:inline-flex}

  .scrim{position:fixed;inset:0;background:rgba(58,50,42,.45);z-index:50;display:none}
  .scrim.show{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;
    background:var(--paper);border-radius:22px 22px 0 0;
    max-height:92vh;overflow-y:auto;display:none;
    padding:8px 16px calc(20px + var(--safe-b));
    animation:up .24s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.show{display:block}
  @keyframes up{from{transform:translateY(18px);opacity:.6}}
  .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;font-weight:600;margin:13px 0 5px}
  label span{font-weight:400;color:var(--muted)}
  .sheet input[type=text],.sheet input[type=number],.sheet textarea{
    width:100%;padding:11px 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);outline:none;
  }
  .sheet input:focus-visible,.sheet textarea:focus-visible{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
  .sheet textarea{min-height:150px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .sw{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px}
  .actions{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:var(--paper);padding:10px 0 2px}
  .btn{flex:1;min-height:50px;border-radius:14px;font-weight:600;font-size:15px}
  .primary{background:var(--sage-deep);color:#fff}
  .primary[disabled]{opacity:.55}
  .ghost{border:1px solid var(--line);color:var(--muted);flex:0 0 96px}
  .danger{color:#A33B2A;flex:0 0 52px;border:1px solid rgba(163,59,42,.3)}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
    bottom:calc(84px + var(--safe-b));z-index:60;
    background:var(--ink);color:#FFFDF8;padding:11px 18px;border-radius:999px;
    font-size:14px;opacity:0;pointer-events:none;transition:.2s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .banner{
    margin:0 16px 12px;padding:11px 14px;border-radius:12px;
    background:#FBEFE0;border:1px solid rgba(168,112,63,.25);
    color:#7A4E1E;font-size:13.5px;max-width:640px;
  }
  @media (min-width:641px){ .banner{margin-left:auto;margin-right:auto} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--sage);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="none" stroke="#3F5240" stroke-width="1.4"/>
      <path d="M14 12v10M24 12v10M13 22h13M11.5 27.5c3-2.5 13-2.5 17 0" fill="none" stroke="#3F5240" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="27" cy="14.5" r="1.8" fill="#5F7D5C"/>
    </svg>
    <div class="brand">
      <h1>คลังคำตอบแชท</h1>
      <p>เก้าอี้โยก · KAO I YOK</p>
    </div>
    <button id="authbtn" class="authbtn">เข้าสู่ระบบ</button>
  </div>

  <div class="searchwrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
    <input type="search" id="q" placeholder="ค้นหา เช่น ราคา ติดเตียง เยี่ยม" autocomplete="off" enterkeyhint="search">
    <button class="clearbtn" id="clear" aria-label="ล้างคำค้น">✕</button>
  </div>

  <div class="chips" id="chips"></div>
</header>

<div id="banner"></div>

<main>
  <p class="count" id="count"></p>
  <div id="feed">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<button class="fab" id="fab">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  เพิ่มคำตอบ
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <h3 id="sheetTitle">เพิ่มคำตอบ</h3>

  <div class="row">
    <div>
      <label for="f-cat">หมวด</label>
      <input type="text" id="f-cat" list="cats" placeholder="เช่น ราคา">
      <datalist id="cats"></datalist>
    </div>
    <div style="flex:0 0 88px">
      <label for="f-sort">ลำดับ</label>
      <input type="number" id="f-sort" value="0">
    </div>
  </div>

  <label for="f-title">ชื่อสถานการณ์</label>
  <input type="text" id="f-title" placeholder="ถามราคาลอย ๆ">

  <label for="f-sit">ลูกค้าทักว่าอะไร <span>— แสดงใต้ชื่อ</span></label>
  <input type="text" id="f-sit" placeholder="ราคาเท่าไหร่คะ">

  <label for="f-body">ข้อความที่จะตอบ <span>— ขึ้นบรรทัดใหม่ = แยกเป็นอีกบับเบิล</span></label>
  <textarea id="f-body" placeholder="รายเดือน 29,000 ค่ะ ตกวันละประมาณ 900 กว่าบาท&#10;ถ้ายังไม่อยากตัดสินใจเป็นเดือน เริ่มจากฝากกลางวันก่อนก็ได้ค่ะ&#10;ตอนนี้คุณพ่อคุณแม่ท่านช่วยเหลือตัวเองได้ประมาณไหนคะ"></textarea>

  <label for="f-note">หมายเหตุถึงแอดมิน <span>— ไม่ถูกคัดลอก</span></label>
  <input type="text" id="f-note" placeholder="อย่าตอบราคาเป็นข้อความสุดท้าย">

  <div class="sw">
    <input type="checkbox" id="f-active" checked style="width:20px;height:20px;accent-color:#3F5240">
    <label for="f-active" style="margin:0;font-weight:400">แสดงในคลัง</label>
  </div>

  <div class="actions">
    <button class="btn danger" id="del" title="ลบ" style="display:none">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
    </button>
    <button class="btn ghost" id="cancel">ยกเลิก</button>
    <button class="btn primary" id="save">บันทึก</button>
  </div>
</div>

<div class="sheet" id="loginSheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="grip"></div>
  <h3 id="loginTitle">เข้าสู่ระบบสำหรับแอดมิน</h3>
  <p style="margin:-8px 0 4px;font-size:13.5px;color:var(--muted)">ใช้เฉพาะตอนจะเพิ่มหรือแก้คำตอบ การคัดลอกไม่ต้องล็อกอิน</p>

  <label for="l-email">อีเมล</label>
  <input type="email" id="l-email" autocomplete="username" inputmode="email" placeholder="admin@kaoiyok.com">

  <label for="l-pass">รหัสผ่าน</label>
  <input type="password" id="l-pass" autocomplete="current-password" placeholder="••••••••">

  <p id="l-err" style="display:none;margin:12px 0 0;font-size:13.5px;color:#A33B2A"></p>

  <div class="actions">
    <button class="btn ghost" id="l-cancel">ยกเลิก</button>
    <button class="btn primary" id="l-go">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const CFG = window.APP_CONFIG || {};
const $ = s => document.querySelector(s);
const feed = $('#feed');

let sb = null, rows = [], cat = 'ทั้งหมด', term = '', isAdmin = false, editingId = null;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark = s => esc(s).replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>');
const hasBlank = t => /\[[^\]]+\]/.test(t);

let tt;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1900);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

function banner(html){ $('#banner').innerHTML = html ? `<div class="banner">${html}</div>` : ''; }

/* ---------- boot ---------- */
if(!CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes('xxxxx')){
  feed.innerHTML = '';
  banner('ยังไม่ได้ตั้งค่าการเชื่อมต่อ เปิดไฟล์ <b>config.js</b> แล้วใส่ Project URL กับ anon key จาก Supabase');
}else{
  sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  init();
}

async function init(){
  sb.auth.onAuthStateChange((_e, session) => paintAuth(session));
  const { data:{ session } } = await sb.auth.getSession();
  paintAuth(session);
  await load();
}

/* ---------- auth ---------- */
async function paintAuth(session){
  const btn = $('#authbtn');
  if(!session){
    isAdmin = false;
    btn.className = 'authbtn';
    btn.textContent = 'เข้าสู่ระบบ';
    btn.onclick = openLogin;
    $('#fab').classList.remove('show');
    render();
    return;
  }
  const u = session.user;
  const { data, error } = await sb.rpc('is_admin');
  isAdmin = !error && data === true;

  btn.className = 'authbtn' + (isAdmin ? ' on' : '');
  const pic = u.user_metadata?.avatar_url;
  btn.innerHTML = (pic ? `<img class="avatar" src="${esc(pic)}" alt="">` : '') +
                  (isAdmin ? 'แอดมิน' : 'ออกจากระบบ');
  btn.onclick = logout;
  $('#fab').classList.toggle('show', isAdmin);

  if(!isAdmin) banner(`บัญชี <b>${esc(u.email)}</b> ยังไม่มีสิทธิ์แก้ไข ให้เพิ่มอีเมลนี้ในตาราง admins ก่อน`);
  else banner('');
  render();
}

function openLogin(){
  $('#l-err').style.display = 'none';
  $('#l-pass').value = '';
  $('#scrim').classList.add('show');
  $('#loginSheet').classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#l-email').focus(), 60);
}

async function doLogin(){
  const email = $('#l-email').value.trim();
  const password = $('#l-pass').value;
  const err = $('#l-err');
  err.style.display = 'none';

  if(!email || !password){
    err.textContent = 'ใส่อีเมลกับรหัสผ่านให้ครบก่อน';
    err.style.display = 'block';
    return;
  }

  $('#l-go').disabled = true;
  $('#l-go').textContent = 'กำลังเข้าสู่ระบบ';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#l-go').disabled = false;
  $('#l-go').textContent = 'เข้าสู่ระบบ';

  if(error){
    err.textContent = /invalid/i.test(error.message)
      ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
      : error.message;
    err.style.display = 'block';
    return;
  }
  closeSheet();
  toast('เข้าสู่ระบบแล้ว');
}

$('#l-go').onclick = doLogin;
$('#l-cancel').onclick = closeSheet;
$('#l-pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
async function logout(){
  await sb.auth.signOut();
  banner('');
  toast('ออกจากระบบแล้ว');
}

/* ---------- data ---------- */
async function load(){
  const { data, error } = await sb.from('snippets')
    .select('*').order('sort_order').order('created_at');
  if(error){
    feed.innerHTML = '';
    banner('โหลดข้อมูลไม่สำเร็จ · ' + esc(error.message));
    return;
  }
  rows = data || [];
  paintChips();
  render();
}

function paintChips(){
  const cats = ['ทั้งหมด', ...new Set(rows.map(r => r.category).filter(Boolean))];
  $('#chips').innerHTML = cats.map(c =>
    `<button class="chip" role="button" aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join('');
  $('#cats').innerHTML = cats.slice(1).map(c => `<option value="${esc(c)}">`).join('');
}

function visible(){
  const t = term.trim().toLowerCase();
  return rows.filter(r => {
    if(!isAdmin && !r.is_active) return false;
    if(cat !== 'ทั้งหมด' && r.category !== cat) return false;
    if(!t) return true;
    return [r.title, r.situation, r.category, r.note, ...(r.bubbles || [])]
      .join(' ').toLowerCase().includes(t);
  });
}

/* ---------- render ---------- */
function render(){
  const list = visible();
  $('#count').textContent = rows.length ? `${list.length} คำตอบ` : '';

  if(!list.length){
    feed.innerHTML = rows.length
      ? `<div class="empty"><strong>ไม่เจอคำตอบที่ตรง</strong>ลองคำสั้นลง เช่น ราคา หรือ เยี่ยม</div>`
      : `<div class="empty"><strong>ยังไม่มีคำตอบในคลัง</strong>เข้าสู่ระบบด้วยบัญชีแอดมินแล้วกดเพิ่มคำตอบ</div>`;
    return;
  }

  feed.innerHTML = list.map(r => {
    const bubbles = (r.bubbles || []).map((b, i) =>
      `<button class="bubble" data-copy="${esc(b)}">
         ${mark(b)}
         <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
           <rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 012-2h9"/>
         </svg>
       </button>`).join('');

    const all = (r.bubbles || []).join('\n\n');
    const blanks = hasBlank(all);

    return `<article class="card${r.is_active ? '' : ' hidden-row'}">
      <div class="eyebrow">
        <span>${esc(r.category || 'ทั่วไป')}</span>
        ${r.is_active ? '' : '<span style="color:var(--clay)">ซ่อนอยู่</span>'}
      </div>
      <h2>${esc(r.title)}</h2>
      ${r.situation ? `<p class="situation">${esc(r.situation)}</p>` : ''}
      ${bubbles}
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}
      <div class="cardfoot">
        <button class="copyall" data-copy="${esc(all)}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>
          คัดลอกทั้งหมด
        </button>
        ${blanks ? '<span class="warn">● มีจุดที่ต้องเติมเอง</span>' : ''}
        ${isAdmin ? `<span class="adminrow">
          <button class="iconbtn" data-edit="${r.id}" aria-label="แก้ไข">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.5 2.5 0 00-3.5-3.5L4 16v4z"/></svg>
          </button></span>` : ''}
      </div>
    </article>`;
  }).join('');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const chip = e.target.closest('.chip');
  if(chip){ cat = chip.dataset.cat; paintChips(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }

  const copier = e.target.closest('[data-copy]');
  if(copier){
    const ok = await copyText(copier.dataset.copy);
    if(ok){
      copier.classList.add('done');
      setTimeout(() => copier.classList.remove('done'), 1300);
      toast(copier.classList.contains('copyall') ? 'คัดลอกครบทุกบับเบิลแล้ว' : 'คัดลอกแล้ว วางในแชทได้เลย');
    }else toast('คัดลอกไม่สำเร็จ ลองกดค้างที่ข้อความแทน');
    return;
  }

  const ed = e.target.closest('[data-edit]');
  if(ed){ openSheet(rows.find(r => r.id === ed.dataset.edit)); return; }
});

$('#q').addEventListener('input', e => {
  term = e.target.value;
  $('#clear').style.display = term ? 'block' : 'none';
  render();
});
$('#clear').onclick = () => { $('#q').value = ''; term = ''; $('#clear').style.display = 'none'; render(); };

/* ---------- sheet ---------- */
function openSheet(row){
  editingId = row?.id || null;
  $('#sheetTitle').textContent = row ? 'แก้ไขคำตอบ' : 'เพิ่มคำตอบ';
  $('#f-cat').value = row?.category || (cat !== 'ทั้งหมด' ? cat : '');
  $('#f-sort').value = row?.sort_order ?? 0;
  $('#f-title').value = row?.title || '';
  $('#f-sit').value = row?.situation || '';
  $('#f-body').value = (row?.bubbles || []).join('\n');
  $('#f-note').value = row?.note || '';
  $('#f-active').checked = row ? row.is_active : true;
  $('#del').style.display = row ? 'grid' : 'none';
  $('#scrim').classList.add('show');
  $('#sheet').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('#scrim').classList.remove('show');
  $('#sheet').classList.remove('show');
  $('#loginSheet').classList.remove('show');
  document.body.style.overflow = '';
}
$('#fab').onclick = () => openSheet(null);
$('#cancel').onclick = closeSheet;
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

$('#save').onclick = async () => {
  const title = $('#f-title').value.trim();
  const bubbles = $('#f-body').value.split('\n').map(s => s.trim()).filter(Boolean);
  if(!title || !bubbles.length){ toast('ใส่ชื่อสถานการณ์กับข้อความก่อน'); return; }

  const payload = {
    category: $('#f-cat').value.trim() || 'ทั่วไป',
    title,
    situation: $('#f-sit').value.trim() || null,
    bubbles,
    note: $('#f-note').value.trim() || null,
    sort_order: Number($('#f-sort').value) || 0,
    is_active: $('#f-active').checked
  };

  $('#save').disabled = true;
  const q = editingId
    ? sb.from('snippets').update(payload).eq('id', editingId)
    : sb.from('snippets').insert(payload);
  const { error } = await q;
  $('#save').disabled = false;

  if(error){ toast('บันทึกไม่สำเร็จ · ' + error.message); return; }
  closeSheet(); await load();
  toast(editingId ? 'แก้ไขแล้ว' : 'เพิ่มแล้ว');
};

$('#del').onclick = async () => {
  if(!editingId || !confirm('ลบคำตอบนี้ถาวรเลยไหม')) return;
  const { error } = await sb.from('snippets').delete().eq('id', editingId);
  if(error){ toast('ลบไม่สำเร็จ · ' + error.message); return; }
  closeSheet(); await load();
  toast('ลบแล้ว');
};
</script>
</body>
</html>
